name: Bug
description: Signaler un comportement incorrect de la plateforme
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de vérifier qu'une issue similaire n'existe pas déjà.
        Ne mettez jamais de mot de passe, de jeton ou de donnée personnelle dans une issue.

  - type: dropdown
    id: area
    attributes:
      label: Partie concernée
      options:
        - Site web
        - API / serveur
        - Application mobile
        - Connecteur start.gg
        - Simulateur
        - CI / Docker / déploiement
        - Autre
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur …
        2. Cliquer sur …
        3. Constater …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environnement
      description: Navigateur, appareil, lecteur d'écran éventuel, branche ou commit.
      placeholder: "Ex. : Firefox 131, Windows 11, NVDA — branche main"

  - type: checkboxes
    id: a11y
    attributes:
      label: Accessibilité
      options:
        - label: Ce bug empêche d'utiliser la plateforme au clavier ou avec un lecteur d'écran

  - type: textarea
    id: extra
    attributes:
      label: Captures, logs, informations complémentaires
